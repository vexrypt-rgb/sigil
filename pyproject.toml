readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41.0.0",
]

[project.scripts]
sigil = "sigil:main"

[tool.setuptools]
py-modules = ["sigil"]
